# Push a version tag (e.g. v1.0.3) to build the Windows NSIS installer
# and publish it as a GitHub Release asset.
#
# Before tagging: bump version in package.json, src-tauri/Cargo.toml,
# and src-tauri/tauri.conf.json so they match the tag (without the "v" prefix).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '仓鼠小助手 v__VERSION__'
          releaseBody: |
            下载下方 Assets 中的 `Hamster Assistant_*_x64-setup.exe` 安装包进行安装。

            安装后开始菜单、桌面快捷方式与「应用和功能」显示为「仓鼠小助手」。
            Windows 数据目录：`%APPDATA%\hamster-assistant\`
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
